<router-outlet></router-outlet>
<app-image-editor></app-image-editor>
<app-character-save-dialog></app-character-save-dialog>
<app-login-modal
  [visible]="loginPromptVisible"
  [context]="loginCtaContext"
  (visibleChange)="onLoginModalVisibleChange($event)">
</app-login-modal>
<!-- One-time welcome for a new account (shown to half of them; see the component). -->
<app-welcome-dialog></app-welcome-dialog>
<!-- One-tap opt-out for people who arrive from a reminder or news notification. -->
<app-push-opt-out></app-push-opt-out>
<!-- Opened from the bell in the Image / Video / Characters switch. -->
<app-whats-new-dialog></app-whats-new-dialog>

<app-credits-purchase
  [visible]="creditPurchaseVisible"
  [context]="creditPurchaseCtaContext"
  (visibleChange)="onCreditPurchaseVisibleChange($event)">
</app-credits-purchase>

<!-- Floating user menu (always available) -->
@if (!hideFloatingMenu) {
  <div class="floating-menu" style="position: fixed; right: .5rem; bottom: .5rem; z-index: 1000;">
    <app-profile-menu [startMinimized]="minimizeFloatingMenu" (loginRequest)="openLoginPrompt()"></app-profile-menu>
  </div>
}
