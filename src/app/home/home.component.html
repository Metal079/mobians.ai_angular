@if (!loginInfo) {
  @for (message of headerMessage; track message.summary) {
    <p-message [severity]="message.severity" [closable]="true" styleClass="mb-2">
      <strong>{{ message.summary }}</strong>
      <span [innerHTML]="message.detail"></span>
    </p-message>
  }
}

<app-generation-mode-switch active="image"></app-generation-mode-switch>

<div class="image-mode-options" role="group" aria-label="Image mode">
  <button type="button" [class.selected]="imageEditor.presentation() !== 'inline'" [attr.aria-pressed]="imageEditor.presentation() !== 'inline'" (click)="chooseImageMode('generate')"><i class="bi bi-image" aria-hidden="true"></i><span><strong>Generate</strong><small>Create a new image from a prompt</small></span></button>
  <button type="button" [class.selected]="imageEditor.presentation() === 'inline'" [attr.aria-pressed]="imageEditor.presentation() === 'inline'" (click)="chooseImageMode('edit')"><i class="bi bi-pencil-square" aria-hidden="true"></i><span><strong>Edit</strong><small>Change an existing image with instructions</small></span></button>
</div>
@if (editingError()) { <p class="image-mode-error" role="alert">{{ editingError() }}</p> }
<app-image-modal></app-image-modal>
<div id="generation-space" [hidden]="imageEditor.presentation() === 'inline'">
  <div id="image-rating-section">
    <app-image-grid
      [showLoading]="showLoading"
      [aspectRatio]="aspectRatio"
      [inpaintingEnabled]="inpaintingEnabled"
      [queuePosition]="queuePosition"
      [queueStatusMessage]="queueStatusMessage"
      [etaSeconds]="etaSeconds"
      (inpaint_mask)="onInpaintMaskChange($event)"
      (imageExpandedChange)="onImageExpandedChange($event)"
      (ringsToSubmit)="onRingsToSubmit($event)"
    ></app-image-grid>
  </div>
  <app-options
    (imagesChange)="onImagesChange($event)"
    (loadingChange)="onShowLoadingChange($event)"
    (aspectRatioChange)="onAspectRatioChange($event)"
    (inpaintingChange)="onInpaintingChange($event)"
    (queuePositionChange)="onQueuePositionChange($event)"
    (queueStatusMessageChange)="onQueueStatusMessageChange($event)"
    (etaChange)="onEtaChange($event)"
    [inpaintMask]="inpaintMask"
    (imageModalOpen)="onImageModalOpenChange($event)"
  ></app-options>
</div>
<app-faq [hidden]="imageEditor.presentation() === 'inline'"></app-faq>
